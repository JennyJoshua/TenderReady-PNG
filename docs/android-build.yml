# OPTIONAL reference workflow. Your template repo already has "Android build and test".
# Only use this if you want runs on every push/pull request. To use it, copy this file by hand to
# .github/workflows/android-build.yml (the ZIP inbox rejects .github/, so it cannot be delivered in the ZIP).
name: Android build and test (TenderReady PNG)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (official action, caching only, no secrets)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile, unit test and build the debug APK
        run: ./gradlew compileDebugSources testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tenderready-png-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
