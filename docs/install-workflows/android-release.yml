name: Android release (manual only)

# Deliberate, manual release build. Never runs on push or pull request.
# Signing is optional and only happens when you choose sign=true AND the four secrets exist.
# Publishing creates a DRAFT GitHub Release, only from main, only for a signed build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        type: string
      module:
        description: Android application module (blank = ANDROID_MODULE variable, else "app")
        required: false
        default: ""
        type: string
      sign:
        description: Sign the APK with your release keystore (needs the 4 secrets in docs/SECURITY.md)
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      publish:
        description: Create a DRAFT GitHub Release (requires sign=true and running from main)
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PROJECT_DIR: ${{ vars.ANDROID_PROJECT_DIR || '.' }}
      MODULE: ${{ inputs.module || vars.ANDROID_MODULE || 'app' }}
      JAVA_VERSION: ${{ vars.ANDROID_JAVA_VERSION || '17' }}
      TAG: ${{ inputs.tag }}
      SIGN: ${{ inputs.sign }}
      LOG_DIR: ci-logs
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=Bad tag::Tag must look like v1.2.3 (optionally v1.2.3-rc1). Got: $TAG"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Android project
        run: bash scripts/validate-android-project.sh

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Release unit tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          cd "$PROJECT_DIR"
          GRADLE_PATH=":${MODULE//\//:}"
          ./gradlew "${GRADLE_PATH}:testReleaseUnitTest" --stacktrace --console=plain --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/$LOG_DIR/release-unit-tests.log"

      - name: Decode keystore (only when sign=true)
        if: inputs.sign == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::error title=Signing secrets missing::Secret ANDROID_KEYSTORE_BASE64 is not set. See docs/SECURITY.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        id: build
        env:
          # Secrets are referenced only here, only for this step, and only when signing was requested.
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ inputs.sign == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ inputs.sign == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ inputs.sign == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ inputs.sign == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          cd "$PROJECT_DIR"
          GRADLE_PATH=":${MODULE//\//:}"
          ./gradlew "${GRADLE_PATH}:assembleRelease" --stacktrace --console=plain --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/$LOG_DIR/release-apk.log"
          APK_DIR="$MODULE/build/outputs/apk/release"
          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "::error title=No release APK::No .apk in $PROJECT_DIR/$APK_DIR."
            exit 1
          fi
          if [[ "$SIGN" != "true" ]]; then
            echo "::warning title=Unsigned APK::sign=false, so the release APK is unsigned and cannot be installed on a phone."
          fi
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          cp "$APK_DIR"/*.apk "$GITHUB_WORKSPACE/release-out/"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-apk-${{ inputs.tag }}
          path: release-out/*.apk
          if-no-files-found: error
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 7 }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-diagnostics-${{ inputs.tag }}
          path: ci-logs/**
          if-no-files-found: ignore
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 7 }}

  publish:
    name: Create draft GitHub Release
    needs: build-release
    if: inputs.publish == 'true' && inputs.sign == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Optional: create an environment named "release-publish" with required reviewers for a second confirmation.
    environment: release-publish
    permissions:
      contents: write   # the only job in this repository that can write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-apk-${{ inputs.tag }}
          path: release-out

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" release-out/*.apk \
            --repo "$REPO" --target "$SHA" --title "$TAG" --generate-notes --draft
